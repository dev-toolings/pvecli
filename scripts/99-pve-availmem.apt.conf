// Re-apply the availmem patch after APT touches pve-manager or qemu-server.
//
// Both patched files belong to Debian packages, so every upgrade of those two
// restores the upstream version and the honest memory reading disappears from
// the interface. Without this hook the patch survives until the next upgrade
// and then vanishes silently, which is the worst of the two failure modes:
// the gauge goes back to counting cache as used and nothing says why.
//
// The hook is deliberately forgiving. `--from-hook` makes the script warn on
// stderr and still exit 0 when an upstream refactor moved an anchor, because a
// cosmetic patch must never leave dpkg half-configured. Check the state with:
//
//   pve-availmem-patch status
//
DPkg::Post-Invoke {
    "if [ -x /usr/local/sbin/pve-availmem-patch ]; then /usr/local/sbin/pve-availmem-patch apply --from-hook; fi";
};
