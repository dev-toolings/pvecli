# Catalogue des services installables dans une VM déclarée par pvecli.
#
# Un service = un rôle Ansible + un tag PVE. Le tag est la jointure : Terraform
# le pose sur la VM, `pvecli iac inventory` le transforme en groupe Ansible
# (internal/iac/inventory.go, GroupName), et site.yml joue le rôle sur ce
# groupe. Aucune des trois moitiés ne connaît les deux autres.
#
# `outputs` décrit ce que le service rend joignable. Ce n'est pas de la
# décoration : c'est ce qui remplit le bloc de connexion en fin de commande.
# Une valeur `secret: true` n'est jamais affichée — seule la référence keychain
# l'est.
version: 1

services:
  - id: docker
    summary: Moteur de conteneurs Docker CE, avec le plugin compose
    role: docker
    outputs:
      - key: docker
        # « docker version » côté invité, relu après coup.
        value: "{{ pvecli_docker_version }}"
      - key: docker.socket
        value: "unix:///var/run/docker.sock"

  - id: postgresql
    summary: PostgreSQL 17, avec une base et un rôle applicatifs créés
    role: postgresql
    ports: [5432]
    outputs:
      - key: postgresql.host
        value: "{{ pvecli_host_ip }}:5432"
      - key: postgresql.database
        value: "{{ pvecli_pg_database }}"
      - key: postgresql.user
        value: "{{ pvecli_pg_user }}"
      - key: postgresql.password
        value: "{{ pvecli_pg_password }}"
        secret: true

  - id: cloudflared
    summary: Connecteur Cloudflare Tunnel — sortant, aucun port ouvert sur la box
    role: cloudflared
    outputs:
      - key: cloudflared.tunnel
        value: "{{ pvecli_cf_tunnel_name }}"
      - key: cloudflared.url
        value: "{{ pvecli_cf_hostname }}"
      - key: cloudflared.token
        value: "{{ pvecli_cf_token }}"
        secret: true

  - id: caddy
    summary: Reverse proxy Caddy partagé, dont les routes viennent des fragments déposés par chaque projet
    role: caddy
    # Pas de `ports:` : ce Caddy ne termine rien publiquement — Cloudflare
    # termine le TLS, cloudflared le rejoint en HTTP simple sur le loopback —
    # et il n'écoute rien tant qu'aucun fragment n'est déposé dans conf.d/. Le
    # socket ouvert est décidé par le fragment d'un projet, pas par ce service.
    # Déclarer 80/443 ici serait un mensonge dans un fichier dont le rôle est
    # d'être vrai (même choix que `docker` et `cloudflared`, qui n'en déclarent
    # pas non plus).
    outputs:
      - key: caddy
        value: "{{ pvecli_caddy_version }}"
      - key: caddy.conf_dir
        value: "{{ pvecli_caddy_conf_dir }}"

  - id: php
    summary: PHP 8.5 depuis Sury, avec FPM, les extensions courantes et Composer
    role: php
    # Pas de `ports:` : php-fpm écoute sur un socket UNIX, pas sur le réseau.
    # Déclarer un port serait décrire une ouverture qui n'existe pas.
    outputs:
      - key: php
        # « php -r echo PHP_VERSION », relu côté invité après installation :
        # la version du paquet et celle qui s'exécute ne sont pas la même
        # affirmation.
        value: "{{ pvecli_php_version }}"
      - key: php.binary
        value: "{{ pvecli_php_binary }}"
      - key: php.fpm.socket
        value: "{{ pvecli_php_fpm_socket }}"
      - key: composer
        value: "{{ pvecli_composer_version }}"
